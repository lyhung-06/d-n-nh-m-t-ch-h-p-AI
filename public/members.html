<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Thành viên</title><link rel='stylesheet' href='/css/style.css'></head><body><div id='app'></div><script src='/js/app.js'></script><script>(async()=>{let [u,ms]=await Promise.all([api('/api/auth/me'),api('/api/members')]);app.innerHTML=shell('Thành viên',`${u.role==='ADMIN'?`<section class='panel'><h3>Thêm thành viên</h3><form id='f' class='grid'><input id='n' placeholder='Họ tên' required><input id='e' type='email' placeholder='Email' required><input id='p' type='password' placeholder='Mật khẩu' required><select id='r'><option value='MEMBER'>Thành viên</option><option value='ADMIN'>Admin</option></select><button class='primary'>Tạo</button></form></section>`:''}<section class='panel'><h3>Danh sách</h3>${ms.map(m=>`<div class='row'><div class='avatar'>${esc(m.name[0])}</div><div class='grow'><b>${esc(m.name)}</b><p>${esc(m.email)}</p></div><span class='badge'>${m.role}</span>${u.role==='ADMIN'?`<button class='danger' onclick='del(${m.id})'>Xóa</button>`:''}</div>`).join('')}</section>`);user();if(window.f)f.onsubmit=async e=>{e.preventDefault();let x=await api('/api/members',{method:'POST',body:{name:n.value,email:e.value,password:p.value,role:r.value}});if(x)location.reload()}})();async function del(i){if(confirm('Xóa thành viên?')){await api('/api/members/'+i,{method:'DELETE'});location.reload()}}</script></body></html>
