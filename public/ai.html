<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>AI Assistant</title><link rel='stylesheet' href='/css/style.css'></head><body><div id='app'></div><script src='/js/app.js'></script><script>app.innerHTML=shell('AI Assistant',`<section class='panel ai'><h2>🤖 Trợ lý AI</h2><p class='muted'>Phân tích dữ liệu dự án và đưa ra đề xuất.</p><form id='f'><textarea id='q' placeholder='Ví dụ: Hãy phân tích tiến độ dự án của tôi'></textarea><button class='primary'>Phân tích bằng AI</button></form><pre id='a'>Kết quả AI sẽ hiển thị ở đây.</pre></section>`);user();f.onsubmit=async e=>{e.preventDefault();a.textContent='AI đang phân tích...';let x=await api('/api/ai/ask',{method:'POST',body:{question:q.value}});a.textContent=x?.answer||''}</script></body></html>
