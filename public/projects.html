<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Dự án</title><link rel='stylesheet' href='/css/style.css'></head><body><div id='app'></div><script src='/js/app.js'></script><script>let edit=null;async function load(){let ps=await api('/api/projects');app.innerHTML=shell('Quản lý dự án',`<section class='panel'><h3>${edit?'Sửa':'Tạo'} dự án</h3><form id='f' class='grid'><input id='n' placeholder='Tên dự án' required><input id='d' type='date'><select id='s'><option value='PLANNING'>Lập kế hoạch</option><option value='IN_PROGRESS'>Đang thực hiện</option><option value='COMPLETED'>Hoàn thành</option></select><input id='p' type='number' min='0' max='100' value='0' placeholder='Tiến độ'><textarea id='desc' placeholder='Mô tả'></textarea><button class='primary'>Lưu</button></form></section><section class='panel'><h3>Danh sách dự án</h3>${ps.map(x=>`<div class='row'><div class='grow'><b>${esc(x.name)}</b><p>${esc(x.description)}</p><div class='bar'><i style='width:${x.progress}%'></i></div></div><span>${x.progress}%</span><button onclick='ed(${x.id})'>Sửa</button><button class='danger' onclick='del(${x.id})'>Xóa</button></div>`).join('')}</section>`);user();f.onsubmit=save}async function save(e){e.preventDefault();let r=await api(edit?'/api/projects/'+edit:'/api/projects',{method:edit?'PUT':'POST',body:{name:n.value,description:desc.value,deadline:d.value,status:s.value,progress:+p.value}});if(r){edit=null;load()}}function ed(i){edit=i;load().then(async()=>{let x=await api('/api/projects/'+i);n.value=x.name;desc.value=x.description;d.value=x.deadline;p.value=x.progress;s.value=x.status})}async function del(i){if(confirm('Xóa dự án?')){await api('/api/projects/'+i,{method:'DELETE'});load()}}load();</script></body></html>
