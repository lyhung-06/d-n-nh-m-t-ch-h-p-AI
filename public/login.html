<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Đăng nhập | PM AI</title><link rel='stylesheet' href='/css/style.css'></head><body class='login'><div class='card auth'><h1>🚀 Project Manager AI</h1><p>Hệ thống quản lý dự án nhóm tích hợp AI</p><div class='tabs'><button id='lt'>Đăng nhập</button><button id='rt'>Đăng ký</button></div><form id='lf'><input id='email' type='email' value='admin@gmail.com' placeholder='Email' required><input id='pass' type='password' value='admin123' placeholder='Mật khẩu' required><button class='primary'>Đăng nhập</button></form><form id='rf' class='hide'><input id='rn' placeholder='Họ tên' required><input id='re' type='email' placeholder='Email' required><input id='rp' type='password' minlength='6' placeholder='Mật khẩu' required><button class='primary'>Đăng ký</button></form><div id='msg'></div><small>Demo: admin@gmail.com / admin123<br>member@gmail.com / member123</small></div><script>const $=x=>document.getElementById(x);lt.onclick=()=>{lf.classList.remove('hide');rf.classList.add('hide')};rt.onclick=()=>{rf.classList.remove('hide');lf.classList.add('hide')};lf.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:pass.value})}),d=await r.json();if(!r.ok)return msg.textContent=d.message;location='dashboard.html'};rf.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:rn.value,email:re.value,password:rp.value})}),d=await r.json();msg.textContent=r.ok?'Đăng ký thành công, hãy đăng nhập.':d.message;if(r.ok)lt.click()}</script></body></html>
