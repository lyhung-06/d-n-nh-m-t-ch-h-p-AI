<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Công việc</title><link rel='stylesheet' href='/css/style.css'></head><body><div id='app'></div><script src='/js/app.js'></script><script>
function overdue(t){return t.status!=='DONE'&&t.deadline&&new Date(t.deadline+'T23:59:59')<new Date()}
function fd(v){if(!v)return '-';return new Date(v+'T00:00:00').toLocaleDateString('vi-VN')}
async function load(){
  let [ts,ps,ms]=await Promise.all([api('/api/tasks'),api('/api/projects'),api('/api/members')]);if(!ts||!ps||!ms)return;
  const overdueCount=ts.filter(overdue).length;
  app.innerHTML=shell('Quản lý công việc',`${overdueCount?`<section class='alert'><h3>⚠️ Có ${overdueCount} nhiệm vụ quá hạn</h3><p>Hãy kiểm tra deadline và cập nhật trạng thái các nhiệm vụ bên dưới.</p></section>`:''}<section class='panel'><h3>Thêm nhiệm vụ</h3><form id='f' class='grid'><input id='t' placeholder='Tên nhiệm vụ' required><select id='pr'>${ps.map(p=>`<option value='${p.id}'>${esc(p.name)}</option>`).join('')}</select><select id='as'>${ms.map(m=>`<option value='${m.id}'>${esc(m.name)}</option>`).join('')}</select><select id='pri'><option value='HIGH'>Cao</option><option value='MEDIUM'>Trung bình</option><option value='LOW'>Thấp</option></select><select id='st'><option value='TODO'>Chưa làm</option><option value='IN_PROGRESS'>Đang làm</option><option value='DONE'>Hoàn thành</option><option value='BLOCKED'>Bị chặn</option></select><input id='dl' type='date'><textarea id='td' placeholder='Mô tả'></textarea><button class='primary'>Thêm nhiệm vụ</button></form></section><section class='panel'><h3>Danh sách</h3><table><tr><th>Nhiệm vụ</th><th>Dự án</th><th>Người làm</th><th>Ưu tiên</th><th>Trạng thái</th><th>Deadline</th><th></th></tr>${ts.map(x=>`<tr><td>${esc(x.title)}${overdue(x)?`<div class='overdue'>⚠️ Quá hạn</div>`:''}</td><td>${esc(x.project?.name||'')}</td><td>${esc(x.assignee?.name||'')}</td><td class='${x.priority==='HIGH'?'priority-high':''}'>${x.priority}</td><td><select onchange='chg(${x.id},this.value)'><option value='TODO' ${x.status==='TODO'?'selected':''}>Chưa làm</option><option value='IN_PROGRESS' ${x.status==='IN_PROGRESS'?'selected':''}>Đang làm</option><option value='DONE' ${x.status==='DONE'?'selected':''}>Hoàn thành</option><option value='BLOCKED' ${x.status==='BLOCKED'?'selected':''}>Bị chặn</option></select></td><td class='${overdue(x)?'overdue':''}'>${fd(x.deadline)}</td><td><button class='danger' onclick='del(${x.id})'>Xóa</button></td></tr>`).join('')}</table></section>`);
  user();
  f.onsubmit=async e=>{e.preventDefault();let r=await api('/api/tasks',{method:'POST',body:{title:t.value,projectId:+pr.value,assigneeId:+as.value,priority:pri.value,status:st.value,deadline:dl.value,description:td.value}});if(r)load()}
}
async function chg(i,s){await api('/api/tasks/'+i,{method:'PUT',body:{status:s}});load()}
async function del(i){if(confirm('Xóa nhiệm vụ?')){await api('/api/tasks/'+i,{method:'DELETE'});load()}}
load();
</script></body></html>
